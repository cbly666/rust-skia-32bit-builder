name: Build Skia Binaries (Win32 & Win11 ARM64)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择构建目标架构 (Target Architecture)'
        required: true
        default: 'aarch64-pc-windows-msvc'
        type: choice
        options:
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc
          - all

jobs:
  build-arm64:
    name: Build Windows 11 ARM64 Skia
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'aarch64-pc-windows-msvc' || github.event.inputs.target == ''
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & Target
        run: |
          rustup default stable
          rustup target add aarch64-pc-windows-msvc

      - name: Ensure Ninja is installed
        run: |
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          ninja --version

      - name: Build Skia ARM64 (from source on cloud)
        run: |
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Package Skia Binaries
        shell: pwsh
        run: |
          # 定位 skia-bindings 编译生成的 out\skia 目录
          # skia-bindings 官方约定：bindings.rs 和所有 .lib 必须直接位于 skia-binaries/ 根目录下（不能有多余的 skia 子目录）
          $buildRoot = "target\aarch64-pc-windows-msvc\release\build"
          $skiaBindingsDir = Get-ChildItem -Path $buildRoot -Directory `
            | Where-Object { $_.Name -match "^skia-bindings-" } `
            | Select-Object -First 1
          if (-not $skiaBindingsDir) {
            Write-Error "ERROR: Could not find skia-bindings-* directory under $buildRoot"
            exit 1
          }
          $skiaDir = Join-Path $skiaBindingsDir.FullName "out\skia"
          Write-Host "Found Skia Lib Dir: $skiaDir"

          # 检查 bindings.rs 必须存在
          $bindingsFile = Join-Path $skiaDir "bindings.rs"
          if (-not (Test-Path $bindingsFile)) {
            Write-Error "ERROR: bindings.rs not found at $bindingsFile"
            Get-ChildItem -Path $skiaBindingsDir.FullName -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "OK: bindings.rs found at $bindingsFile"

          # 创建标准 skia-binaries 根目录
          # 关键：只拷贝顶层纯文件（.lib, bindings.rs, .dat, .txt），严格排除 obj/、gen/ 等临时子目录，避免 Windows 解压时产生目录冲突 (os error 145)
          New-Item -ItemType Directory -Force -Path "dist\staging\skia-binaries"
          Get-ChildItem -Path $skiaDir -File | Copy-Item -Destination "dist\staging\skia-binaries"

          $tarName = "skia-binaries-a25a0fdb7d90429aa2d1-aarch64-pc-windows-msvc-jpegd-jpege-pdf.tar.gz"
          tar -czf "dist\$tarName" -C "dist\staging" skia-binaries
          Write-Host "Packaged successfully: dist\$tarName"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-arm64-binaries
          path: dist/*.tar.gz

  build-win32:
    name: Build Windows 32-bit (x86) Skia
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'i686-pc-windows-msvc'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 32-bit Target
        run: |
          rustup target add i686-pc-windows-msvc

      - name: Install NASM & Ninja
        run: |
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          if (!(Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y
            echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
          }
          ninja --version
          nasm -v

      - name: Build Skia 32-bit (from source on cloud)
        run: |
          $env:LLVM_HOME = "C:\Program Files\LLVM"
          cargo build --release --target i686-pc-windows-msvc

      - name: Package Skia Binaries
        shell: pwsh
        run: |
          # 定位 skia-bindings 编译生成的 out\skia 目录
          $buildRoot = "target\i686-pc-windows-msvc\release\build"
          $skiaBindingsDir = Get-ChildItem -Path $buildRoot -Directory `
            | Where-Object { $_.Name -match "^skia-bindings-" } `
            | Select-Object -First 1
          if (-not $skiaBindingsDir) {
            Write-Error "ERROR: Could not find skia-bindings-* directory under $buildRoot"
            exit 1
          }
          $skiaDir = Join-Path $skiaBindingsDir.FullName "out\skia"
          Write-Host "Found Skia Lib Dir: $skiaDir"

          # 检查 bindings.rs 必须存在
          $bindingsFile = Join-Path $skiaDir "bindings.rs"
          if (-not (Test-Path $bindingsFile)) {
            Write-Error "ERROR: bindings.rs not found at $bindingsFile"
            Get-ChildItem -Path $skiaBindingsDir.FullName -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "OK: bindings.rs found at $bindingsFile"

          # 创建标准 skia-binaries 根目录，只拷贝顶层纯文件
          New-Item -ItemType Directory -Force -Path "dist\staging\skia-binaries"
          Get-ChildItem -Path $skiaDir -File | Copy-Item -Destination "dist\staging\skia-binaries"

          $tarName = "skia-binaries-a25a0fdb7d90429aa2d1-i686-pc-windows-msvc-jpegd-jpege-pdf.tar.gz"
          tar -czf "dist\$tarName" -C "dist\staging" skia-binaries
          Write-Host "Packaged successfully: dist\$tarName"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-32bit-binaries
          path: dist/*.tar.gz